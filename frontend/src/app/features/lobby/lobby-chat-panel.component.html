<aside
  class="flex h-full min-h-[20rem] flex-col gap-2 rounded-xl border border-stone-200 bg-white p-4 shadow-sm"
  aria-label="lobby chat"
>
  <h2 class="font-display text-base font-semibold text-stone-900">
    {{ 'lobby.chat.title' | t }}
  </h2>

  <div #log data-testid="chat-log" class="-mr-1 max-h-72 flex-1 overflow-y-auto pr-1">
    @if (!hasMessages()) {
      <p class="text-sm italic text-stone-400">{{ 'lobby.chat.empty' | t }}</p>
    } @else {
      <ul class="flex flex-col gap-1.5">
        @for (msg of messages(); track msg.id) {
          <li
            class="rounded-md bg-stone-50 px-2.5 py-1.5 text-sm ring-1 ring-inset ring-stone-200"
            data-testid="chat-message"
          >
            <span class="flex items-baseline justify-between text-xs text-stone-500">
              <strong class="font-semibold text-stone-800">{{ msg.fromUserName }}</strong>
              <time>{{ formatTimestamp(msg.createdAt) }}</time>
            </span>
            <span class="block break-words text-stone-900">{{ msg.text }}</span>
          </li>
        }
      </ul>
    }
  </div>

  <form [formGroup]="form" (ngSubmit)="send()" novalidate class="flex gap-2">
    <input
      type="text"
      formControlName="text"
      autocomplete="off"
      [attr.placeholder]="'lobby.chat.placeholder' | t"
      data-testid="chat-input"
      maxlength="500"
      class="flex-1 rounded-md border border-stone-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    />
    <button
      type="submit"
      [disabled]="sending() || form.invalid"
      data-testid="chat-send"
      class="rounded-md bg-brand-600 px-3 py-1.5 text-sm font-semibold text-white shadow transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ 'lobby.chat.send' | t }}
    </button>
  </form>
</aside>
