<aside
  class="flex h-full min-h-[14rem] flex-col gap-2 rounded-xl bg-black/30 p-3 text-white shadow"
  aria-label="game chat"
  data-testid="chat-panel"
>
  <header class="flex flex-col gap-1">
    <h3 class="m-0 text-xs font-semibold uppercase tracking-widest text-white/70">
      {{ 'game.chat' | t }}
    </h3>
    @if (tacticalBanner()) {
      <p
        class="m-0 rounded-md bg-warm-400/15 px-2 py-1 text-xs text-warm-200"
        data-testid="tactical-banner"
      >
        {{ 'game.chat.tacticalBanner' | t }}
      </p>
    }
  </header>

  <div class="-mr-1 max-h-80 flex-1 overflow-y-auto pr-1" #log data-testid="chat-log">
    @if (!hasMessages()) {
      <p class="m-0 text-sm italic text-white/50">{{ 'game.chat.empty' | t }}</p>
    } @else {
      <ul class="flex flex-col gap-1.5">
        @for (msg of messages(); track msg.id) {
          <li
            class="flex flex-col gap-0.5 rounded-md bg-white/5 px-2 py-1.5"
            data-testid="chat-message"
          >
            <span class="flex items-baseline justify-between text-[0.7rem] text-white/60">
              <strong class="font-semibold text-white/90">{{ msg.fromUserName }}</strong>
              <time>{{ formatTimestamp(msg.createdAt) }}</time>
            </span>
            <span class="block break-words text-sm">{{ msg.text }}</span>
          </li>
        }
      </ul>
    }
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex gap-2">
    <input
      type="text"
      formControlName="text"
      autocomplete="off"
      maxlength="500"
      [attr.placeholder]="'game.chat.placeholder' | t"
      data-testid="chat-input"
      class="flex-1 rounded-md border border-white/10 bg-white/10 px-2.5 py-1.5 text-sm text-white placeholder-white/50 focus:border-warm-400 focus:outline-none focus:ring-2 focus:ring-warm-400/30 disabled:opacity-50"
    />
    <button
      type="submit"
      [disabled]="sending() || form.invalid || !canSend()"
      data-testid="chat-send"
      class="rounded-md bg-warm-400 px-3 py-1.5 text-xs font-semibold text-table-900 shadow transition hover:bg-warm-200 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ 'game.chat.send' | t }}
    </button>
  </form>
</aside>
