<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  class="flex flex-col gap-3"
  data-testid="change-password-form"
>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-stone-700">
      {{ 'profile.security.currentPasswordLabel' | t }}
    </span>
    <input
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      data-testid="change-password-current"
      class="rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    />
    @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
      <span class="text-xs text-rose-700">{{ 'auth.validation.required' | t }}</span>
    }
  </label>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-stone-700">
      {{ 'profile.security.password.newLabel' | t }}
    </span>
    <input
      type="password"
      formControlName="newPassword"
      autocomplete="new-password"
      data-testid="change-password-new"
      class="rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    />
    @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
      <span class="text-xs text-rose-700">
        @if (form.controls.newPassword.hasError('required')) {
          {{ 'auth.validation.required' | t }}
        } @else if (form.controls.newPassword.hasError('minlength')) {
          {{ 'auth.validation.passwordMinLength' | t }}
        } @else if (form.controls.newPassword.hasError('noLetter')) {
          {{ 'auth.validation.passwordLetter' | t }}
        } @else if (form.controls.newPassword.hasError('noDigit')) {
          {{ 'auth.validation.passwordDigit' | t }}
        }
      </span>
    }
  </label>
  <label class="flex flex-col gap-1">
    <span class="text-sm font-medium text-stone-700">
      {{ 'profile.security.password.confirmLabel' | t }}
    </span>
    <input
      type="password"
      formControlName="confirmPassword"
      autocomplete="new-password"
      data-testid="change-password-confirm"
      class="rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30"
    />
    @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid) {
      <span class="text-xs text-rose-700">
        @if (form.controls.confirmPassword.hasError('required')) {
          {{ 'auth.validation.required' | t }}
        } @else if (form.controls.confirmPassword.hasError('mismatch')) {
          {{ 'profile.security.password.mismatch' | t }}
        }
      </span>
    }
  </label>
  <button
    type="submit"
    [disabled]="submitting() || form.invalid"
    data-testid="change-password-submit"
    class="self-start inline-flex h-9 items-center justify-center rounded-md bg-brand-600 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60"
  >
    @if (submitting()) {
      {{ 'profile.security.password.submitting' | t }}
    } @else {
      {{ 'profile.security.password.submit' | t }}
    }
  </button>
</form>
