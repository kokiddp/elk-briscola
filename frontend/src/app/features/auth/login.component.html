<section class="auth-page">
  <h1>{{ 'auth.login.title' | t }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ 'auth.login.usernameOrEmail' | t }}</span>
      <input
        type="text"
        formControlName="usernameOrEmail"
        autocomplete="username"
        data-testid="usernameOrEmail"
      />
      @if (
        form.controls.usernameOrEmail.touched && form.controls.usernameOrEmail.errors?.['required']
      ) {
        <small class="error">{{ 'auth.validation.required' | t }}</small>
      }
    </label>

    <label>
      <span>{{ 'auth.login.password' | t }}</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        data-testid="password"
      />
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <small class="error">{{ 'auth.validation.required' | t }}</small>
      }
    </label>

    @if (errorMessage(); as msg) {
      <p class="error" role="alert">{{ msg }}</p>
    }

    <button type="submit" [disabled]="submitting() || form.invalid" data-testid="submit">
      @if (submitting()) {
        {{ 'auth.login.submitting' | t }}
      } @else {
        {{ 'auth.login.submit' | t }}
      }
    </button>
  </form>

  <p>
    {{ 'auth.login.needAccount' | t }}
    <a routerLink="/register">{{ 'auth.login.register' | t }}</a>
  </p>
</section>
