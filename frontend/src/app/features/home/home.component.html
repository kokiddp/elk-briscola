<section class="home">
  <h1>{{ welcomeMessage() }}</h1>
  <p>{{ placeholder() }}</p>
  <a routerLink="/lobby" data-testid="go-to-lobby">{{ lobbyLinkLabel() }}</a>
  <a routerLink="/profile" data-testid="go-to-profile">{{ profileLinkLabel() }}</a>
  <button type="button" (click)="logout()" data-testid="logout">{{ logoutLabel() }}</button>
</section>
