# Reverse-proxy upstream. The compose service name `api` resolves via
# the user-defined bridge network's embedded DNS. If you deploy this
# image somewhere the backend isn't reachable as `api:8080`, mount your
# own /etc/nginx/conf.d/default.conf instead of forking the image.
upstream briscola_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip on the wire — Angular's hashed bundles compress 4-6x.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
    gzip_vary on;

    # Proxy the REST API to the backend service. Long timeouts because
    # most calls finish fast; SignalR negotiation lands here on its first
    # HTTP POST.
    location /api/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR hubs (game + lobby) — needs Upgrade/Connection passthrough
    # so the WebSocket transport actually upgrades. Long read timeout so
    # idle connections aren't snapped mid-game.
    location /hubs/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Card-set assets are served by the backend's wwwroot/.
    location /card-sets/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed assets (Angular emits `*.<hash>.js`, etc.) — cache aggressively.
    location ~* \.(?:js|css|woff2?|ico|png|jpe?g|gif|webp|svg|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached — it carries the hash references
    # the SPA boots from. A stale index would freeze users on an old
    # bundle even after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback. Angular owns client-side routing; every non-asset URL
    # falls back to index.html so deep links work after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
