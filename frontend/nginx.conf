server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip on the wire — Angular's hashed bundles compress 4-6x.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
    gzip_vary on;

    # Hashed assets (Angular emits `*.<hash>.js`, etc.) — cache aggressively.
    # The build emits .js / .css / .woff2 / .ico / images here.
    location ~* \.(?:js|css|woff2?|ico|png|jpe?g|gif|webp|svg|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached — it carries the hash references
    # the SPA boots from. A stale index would freeze users on an old
    # bundle even after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback. Angular owns client-side routing; every non-asset URL
    # falls back to index.html so deep links work after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
