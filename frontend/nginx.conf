# Reverse-proxy upstream. The compose service name `api` resolves via
# the user-defined bridge network's embedded DNS. If you deploy this
# image somewhere the backend isn't reachable as `api:8080`, mount your
# own /etc/nginx/conf.d/default.conf instead of forking the image.
upstream briscola_api {
    server api:8080;
}

# Canonical WebSocket-upgrade map. Without it, hardcoding
# `Connection "upgrade"` on the /hubs/ proxy would inject an Upgrade
# header on every request — including the SignalR long-polling fallback
# transport, which then gets routed to a wedged WebSocket path. The map
# returns "upgrade" only when the client actually sent one; otherwise
# the original Connection value is preserved.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to every response served by this nginx
    # (the SPA's index.html + hashed assets + proxied backend paths).
    # The backend's SecurityHeadersMiddleware ALSO sets these for
    # /api/* and /hubs/*, but it can't reach plain `GET /` — that's
    # served directly off /usr/share/nginx/html below. Belt-and-
    # suspenders is fine; nginx writes these first and the upstream
    # ASP.NET pipeline doesn't re-emit duplicates.
    #
    # `always` ensures the headers go on 4xx + 5xx responses too,
    # which is where security-scanner findings usually come from.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: the SPA self-loads Angular bundles. Assets come from same-
    # origin. The SignalR WebSocket goes over ws/wss which we capture
    # explicitly. 'unsafe-inline' on style-src is the Tailwind
    # generated stylesheet. 'unsafe-inline' on script-src covers the
    # Critters-emitted `onload="this.media='all'"` inline event handler
    # on the async-loaded stylesheet link (chrome blocks it under
    # script-src 'self' alone, because inline event handlers count as
    # script). Tighten to a nonce-based policy or 'unsafe-hashes' with
    # known sha256 when the build pipeline supports it. Keep on one
    # line — nginx doesn't honor `\` continuations and would emit them
    # literally.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip on the wire — Angular's hashed bundles compress 4-6x.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
    gzip_vary on;

    # Proxy the REST API to the backend service. Long timeouts because
    # most calls finish fast; SignalR negotiation lands here on its first
    # HTTP POST. The `^~` prefix tells nginx to short-circuit regex
    # matching once this block wins — without it the `\.(?:js|svg|...)$`
    # asset rule below would steal requests like /api/v1/foo.json.
    location ^~ /api/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SignalR hubs (game + lobby) — needs Upgrade/Connection passthrough
    # so the WebSocket transport actually upgrades. Long read timeout so
    # idle connections aren't snapped mid-game.
    location ^~ /hubs/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Card-set assets are served by the backend's wwwroot/. `^~` again
    # so .svg / .png assets under /card-sets/ aren't grabbed by the
    # immutable-cache regex below.
    location ^~ /card-sets/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Auto-generated API documentation surfaces — Swagger UI, OpenAPI
    # JSON, Scalar, AsyncAPI viewer, and the /docs landing page. These
    # are mounted by Briscola.Api only when ASPNETCORE_ENVIRONMENT=
    # Development, so in production the backend returns 404 for all of
    # them (which is the intended posture — minimal public surface).
    # Without these proxy blocks the SPA's catch-all `try_files` rule
    # would intercept the URLs and serve index.html instead.
    location ^~ /swagger/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /swagger {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /scalar/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /scalar {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /docs/ {
        proxy_pass http://briscola_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /docs {
        proxy_pass http://briscola_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed assets (Angular emits `*.<hash>.js`, etc.) — cache aggressively.
    location ~* \.(?:js|css|woff2?|ico|png|jpe?g|gif|webp|svg|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached — it carries the hash references
    # the SPA boots from. A stale index would freeze users on an old
    # bundle even after a deploy.
    #
    # Repeating the security headers here: nginx's `add_header`
    # inheritance is suppressed inside a location block that defines
    # its own `add_header`, so the server-level entries above don't
    # reach this response without being restated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback. Angular owns client-side routing; every non-asset URL
    # falls back to index.html so deep links work after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
