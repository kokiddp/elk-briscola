<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"
     role="img" aria-label="Cinque di Bastoni">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f5f5f0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="196" height="276" rx="8" ry="8"
        fill="url(#bg)" stroke="#2e7d32" stroke-width="3"/>
  <!-- top-left corner -->
  <g transform="translate(16,30)">
    <text x="0" y="0" text-anchor="start" font-family="Georgia, serif"
          font-weight="700" font-size="28" fill="#2e7d32">5</text>
    <text x="0" y="22" text-anchor="start" font-family="Georgia, serif"
          font-size="18" fill="#2e7d32">🌿</text>
  </g>
  <!-- bottom-right corner, rotated 180° -->
  <g transform="rotate(180 100 140) translate(16,30)">
    <text x="0" y="0" text-anchor="start" font-family="Georgia, serif"
          font-weight="700" font-size="28" fill="#2e7d32">5</text>
    <text x="0" y="22" text-anchor="start" font-family="Georgia, serif"
          font-size="18" fill="#2e7d32">🌿</text>
  </g>
  <!-- centerpiece -->
  <text x="100" y="150" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="88" font-weight="700"
        fill="#2e7d32">5</text>
  <text x="100" y="208" text-anchor="middle"
        font-family="Georgia, serif" font-size="20" fill="#2e7d32"
        opacity="0.85">Bastoni</text>
</svg>
