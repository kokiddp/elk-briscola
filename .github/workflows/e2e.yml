name: e2e

# Skeleton workflow. Populated in Phase 13 (Playwright golden path).
# Until then, runs a single placeholder job so the workflow is visible
# in the Actions tab and required-status-check setup is straightforward.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'frontend/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Opt every JS-based action in this workflow into Node.js 24 ahead of the
# June 2026 forced cut-over. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  placeholder:
    name: e2e (skipped — populated in Phase 13)
    runs-on: ubuntu-latest
    steps:
      - run: echo "e2e suite is implemented in Phase 13. This job is a placeholder."
