name: e2e

# Spins up the full compose stack (postgres + api + frontend nginx) and
# runs the Playwright golden-path + reconnect specs against it. This is
# the only place we exercise the real ingress contract end-to-end —
# the backend + frontend unit suites cover the inner layers.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Opt every JS-based action in this workflow into Node.js 24 ahead of the
# June 2026 forced cut-over. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Playwright (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate compose secrets
        # The compose stack refuses to start if POSTGRES_PASSWORD /
        # JWT_SIGNING_KEY aren't set. Generate ephemeral ones for this
        # CI run; nothing persists across jobs.
        run: |
          set -euo pipefail
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 32)"
            # Stress env relaxes the auth rate limits (3 register / hour
            # / IP in prod) so the E2E can register a fresh user per spec.
            echo "ASPNETCORE_ENVIRONMENT=Stress"
            # CORS: the ingress port. CI runs on localhost:8080.
            echo "ALLOWED_ORIGIN=http://localhost:8080"
          } > .env

      - name: Build + start compose stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Show stack state (sanity)
        if: always()
        run: |
          docker compose ps
          curl -fsS http://localhost:8080/healthz || true
          curl -fsS http://localhost:8080/readyz  || true

      - name: Run Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          CI: 'true'
        run: npx playwright test

      - name: Dump api logs on failure
        if: failure()
        run: docker compose logs api --tail=400

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
